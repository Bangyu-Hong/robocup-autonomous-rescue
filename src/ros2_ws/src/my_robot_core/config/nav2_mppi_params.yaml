amcl:
  ros__parameters:
    use_sim_time: False              # 真实物理车必须设为 False！（如果你在跑实车，请全局把所有 use_sim_time 改为 False）
    alpha1: 0.2                     # 机器人的旋转导致旋转估算误差的权重
    alpha2: 0.2                     # 机器人的平移导致旋转估算误差的权重
    alpha3: 0.2                     # 机器人的平移导致平移估算误差的权重
    alpha4: 0.2                     # 机器人的旋转导致平移估算误差的权重
    base_frame_id: "base_footprint" # 🌟 完美！身体基准坐标系已正确设置
    global_frame_id: "map"          # 全局坐标系
    odom_frame_id: "odom"           # 里程计坐标系
    laser_max_range: 100.0          # 雷达最大信任距离（思岚C1一般写 12.0 或 16.0 即可）
    max_particles: 2000             # 🌟 最大粒子数。RK3588算力强，2000能保证定位极其精准
    min_particles: 500              # 最小粒子数
    robot_model_type: "nav2_amcl::OmniMotionModel" # ⚠️ 麦轮建议改为 "nav2_amcl::OmniMotionModel" 以支持全向运动学估算！
    save_pose_rate: 0.5             # 每秒保存多少次位置到磁盘（用于下次开机恢复位置）
    scan_topic: scan                # 雷达话题名，确认下你真实发布的是不是 /scan

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10            # 行为树循环频率 (10Hz)
    default_server_timeout: 20      # 动作节点超时时间

# ... (bt_navigator 插件列表保持原样，省略注释) ...

controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0      # 🌟 局部路径规划频率。RK3588 跑 20Hz MPPI 毫无压力，动作极速丝滑
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5   # ⚠️ 这里设为 0.5 太大了！意味着横移速度小于0.5m/s时会被直接忽略。建议改为 0.001
    min_theta_velocity_threshold: 0.001
    
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5 # 10秒内如果移动不到 0.5 米，系统就判定小车卡死了，触发恢复行为
      movement_time_allowance: 10.0
      
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25       # 🌟 到达目标的 XY 容差 (25厘米)。比赛时如果要精准抓取，建议缩小到 0.05
      yaw_goal_tolerance: 0.25      # 到达目标的角度容差 (约14度)

    # ======= MPPI 局部规划器参数 =======
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56              # 预测未来 56 步
      model_dt: 0.05              # 每步 0.05 秒
      batch_size: 2000            # 瞬间撒出 2000 条轨迹
      vx_std: 0.2                 # 前进速度采样方差
      vy_std: 0.2                 # 麦轮横移采样方差
      vtheta_std: 0.4             # 旋转采样方差
      motion_model: "Omni"        # 🌟 开启全向麦轮模式

      kinematics:
        max_vel_x: 0.5            # 最大前进速度 (m/s)
        max_vel_y: 0.3            # 最大横移速度 (m/s)
        max_vel_theta: 1.0        # 最大旋转角速度 (rad/s)
      # ... (Critics 权重参数保持原样) ...

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0       # 局部地图刷新频率 5Hz
      publish_frequency: 2.0      # 发布给 RViz 的频率
      rolling_window: true        # 🌟 局部地图跟随小车一起移动
      width: 3                    # 局部地图宽 3 米
      height: 3                   # 局部地图长 3 米
      resolution: 0.05            # 像素精度：5厘米一格
      robot_radius: 0.22          # 🌟 小车半径。用卷尺量一下你的车模！如果是方形，这必须是能包住车体的外接圆半径。
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  # 膨胀层的衰减率。值越大，墙壁的“引力场”衰减越快，车越敢贴墙。
        inflation_radius: 0.55    # 🌟 绝对危险膨胀半径。必须大于 robot_radius，否则车会撞墙！

      voxel_layer:                # 3D 障碍物层 (目前用作 2D 激光雷达层)
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan            # 你的雷达话题
          raytrace_max_range: 3.0 # 清除障碍物的最远视距
          obstacle_max_range: 2.5 # 标记障碍物的最远视距

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0       # 全局地图不需要刷太快，1Hz 省 CPU
      track_unknown_space: true   # 🌟 探索未知领域的灵魂开关！开启后才会识别灰色区域
      robot_radius: 0.22          # 必须和 local_costmap 保持一致
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0  
        inflation_radius: 0.55    # 必须和 local_costmap 保持一致

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    use_sim_time: False
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner" # ⚠️ 警报：你怎么退回老版本 Dijkstra 算法了？
      # 🌟 强烈建议换回：plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true         # 🌟 配合探索的灵魂开关，允许在没图的地方画线

velocity_smoother:
  ros__parameters:
    use_sim_time: False
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # ⚠️⚠️⚠️ 致命警报：这里封印了你的麦克纳姆轮！
    # max_velocity 参数依次是 [X(前后), Y(左右), Theta(旋转)]
    # 你现在的配置 Y 是 0.0，意思是彻底禁止小车横着走！
    # 🌟 必须修改为与 MPPI 匹配的值：
    max_velocity: [0.26, 0.2, 1.0]      # 允许 Y 轴横移速度上限 0.2
    min_velocity: [-0.26, -0.2, -1.0]   # 允许 Y 轴向右横移速度下限 -0.2
    max_accel: [2.5, 1.0, 3.2]          # Y 轴也必须给加速度，否则加不起来
    max_decel: [-2.5, -1.0, -3.2]       
    odom_topic: "odom"
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-labelledby="title desc">
  <title id="title">ROS 1 建图与 STM32F407 底盘接口</title>
  <desc id="desc">上位机经串口下发车体速度，STM32F407 执行麦轮运动学与四轮速度闭环，编码器和 WT901 IMU 参与里程计反馈。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#64748b" stroke-width="1.5"/></marker>
    <style>
      text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#15243a}
      .title{font-size:27px;font-weight:700}.label{font-size:21px;font-weight:700}.body{font-size:17px}.small{font-size:14px;fill:#53657c}.tag{font-size:14px;fill:#176b8a;font-weight:700}
      .line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1100" height="610" rx="20" fill="#f3f6fa"/>
  <text x="38" y="51" class="title">ROS 1 建图与 STM32F407 底盘接口</text>
  <text x="38" y="80" class="small">依据已确认的 ROS 1 建图用途及 STM32F407 底盘源码绘制</text>
  <rect x="307" y="111" width="486" height="112" rx="12" class="box"/>
  <text x="329" y="143" class="tag">上位机接口</text>
  <text x="329" y="175" class="label">ROS 1 · 建图与数据处理</text>
  <text x="329" y="204" class="body">激光扫描 / 里程计 / TF 坐标关系</text>
  <path d="M470 223 V275" class="line"/>
  <path d="M630 275 V223" class="line"/>
  <text x="308" y="253" class="small">$vx,vy,wz</text>
  <text x="663" y="253" class="small">$x,y,th,vx,vy,wz</text>
  <rect x="307" y="275" width="486" height="240" rx="12" fill="#e9f1fc" stroke="#98b7dd" stroke-width="1.5"/>
  <text x="329" y="310" class="tag">已确认的实际底盘主控</text>
  <text x="329" y="346" class="label">STM32F407</text>
  <text x="329" y="382" class="body">串口 / DMA → 车体速度 → 麦轮逆运动学</text>
  <text x="329" y="415" class="body">速度斜坡 → 四轮速度闭环 → PWM 输出</text>
  <text x="329" y="448" class="body">编码器 + IMU → 里程计与航向反馈</text>
  <text x="329" y="486" class="small">Core/Src/main.c · stm32f4xx_it.c · tim.c</text>
  <rect x="38" y="288" width="227" height="96" rx="12" class="box"/>
  <text x="59" y="325" class="label">四轮编码器</text>
  <text x="59" y="357" class="body">轮速与位移反馈</text>
  <path d="M265 336 H307" class="line"/>
  <rect x="38" y="409" width="227" height="96" rx="12" class="box"/>
  <text x="59" y="446" class="label">WT901 系列 IMU</text>
  <text x="59" y="478" class="body">姿态帧解析与航向参考</text>
  <path d="M265 457 H307" class="line"/>
  <rect x="835" y="328" width="227" height="139" rx="12" class="box"/>
  <text x="856" y="365" class="label">电机驱动与执行</text>
  <text x="856" y="399" class="body">四路电机方向 / PWM</text>
  <text x="856" y="432" class="body">四轮麦克纳姆底盘</text>
  <path d="M793 398 H835" class="line"/>
  <text x="38" y="562" class="small">上位机进行环境建图，底盘反馈轮速、位姿与航向；移动控制方式以实际运行记录为准。</text>
  <text x="38" y="587" class="small">图示说明软件与硬件接口关系，控制性能以对应工程和实测记录为准。</text>
</svg>
